[tasks.build]
description = "Build the local binary"
run = "go build -o bin/blackboard ./cmd/blackboard"

[tasks.install]
description = "Install blackboard in GOBIN"
run = "go install ./cmd/blackboard"

[tasks.test]
description = "Run race-enabled tests"
run = "go test -race ./..."

[tasks.check]
description = "Run vet and race-enabled tests"
run = ["go vet ./...", "go test -race ./..."]

[tasks.smoke]
description = "Run an isolated CLI and Git smoke test"
depends = ["build"]
run = "python3 scripts/smoke.py"
