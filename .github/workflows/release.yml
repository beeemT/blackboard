name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: blackboard-release
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify stable tag belongs to default branch
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD "refs/remotes/origin/${DEFAULT_BRANCH}"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race -timeout 10m ./...
      - name: Build archives and formula
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py "$TAG"
      - run: ruby -c dist/blackboard.rb
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Verify archive checksums
        run: cd dist && sha256sum --check checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: legacy
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$TAP_TOKEN"
          ASKPASS=$(mktemp)
          trap 'rm -f "$ASKPASS"' EXIT
          cat > "$ASKPASS" <<'SCRIPT'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "x-access-token" ;;
            *Password*) printf '%s\n' "$TAP_TOKEN" ;;
            *) exit 1 ;;
          esac
          SCRIPT
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0
          git clone https://github.com/beeemT/tap.git /tmp/tap
          mkdir -p /tmp/tap/Formula
          # A backport tag or rerun must not downgrade the tap's current formula.
          if [ -f /tmp/tap/Formula/blackboard.rb ]; then
            UPDATE=$(python3 - <<'PYTHON'
          import pathlib, re, sys
          def version(path):
              text = pathlib.Path(path).read_text()
              match = re.search(r'^\s*version "([0-9]+)\.([0-9]+)\.([0-9]+)"\s*$', text, re.M)
              if not match:
                  sys.exit("Cannot determine formula version; refusing to overwrite")
              return tuple(map(int, match.groups()))
          if version("dist/blackboard.rb") < version("/tmp/tap/Formula/blackboard.rb"):
              print("A newer formula is already published; leaving the tap unchanged")
              print("skip")
          else:
              print("update")
          PYTHON
            )
            if [ "$UPDATE" != "update" ]; then
              echo "$UPDATE"
              exit 0
            fi
          fi
          cp dist/blackboard.rb /tmp/tap/Formula/blackboard.rb
          cd /tmp/tap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Formula/blackboard.rb
          if ! git diff --cached --quiet; then
            git commit -m "blackboard ${TAG}"
            git push
          fi
